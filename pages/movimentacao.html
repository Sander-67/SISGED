<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Movimentação administrativa do NetNúcleo">
    <meta name="author" content="Bárbara Rodrigues">
    <meta name="language" content="pt-br">
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="dark light">

    <title>Movimentação | NetNúcleo</title>

    <link rel="stylesheet" href="/css/movimentacao.css">
</head>

<body>

        <!-- CABEÇALHO -->
    <header class="topbar">

        <a href="dashboard.html" class="logo-link">

            <div class="logo-icon">
                ◆
            </div>

            <strong>NetNúcleo</strong>

        </a>


        <nav class="top-menu">

            <a href="consultas.html">
                Consulta
            </a>

            <a href="relatorios.html">
                Relatório
            </a>

            <a href="#">
                Perfil
            </a>

        </nav>


        <div class="user-area">

            <div class="user-info">

                <strong>Usuário</strong>

                <span>Administrador</span>

            </div>

            <div class="user-icon">
                ♙
            </div>

        </div>

    </header>



    <div class="page-container">


        <!-- MENU LATERAL -->

        <aside class="sidebar">

            <div class="sidebar-title">
                MOVIMENTAÇÃO
            </div>


            <nav class="sidebar-menu">

                <button
                    class="mov-menu"
                    data-mov="aula">

                    <span>▣</span>
                    Lançamento de Aula

                </button>


                <button
                    class="mov-menu"
                    data-mov="atividade">

                    <span>▤</span>
                    Lançamento de Atividades

                </button>


                <button
                    class="mov-menu"
                    data-mov="programacao">

                    <span>▦</span>
                    Programação de Turmas

                </button>


                <button
                    class="mov-menu"
                    data-mov="ocorrencia">

                    <span>⚠</span>
                    Ocorrências

                </button>

            </nav>


            <div class="sidebar-divider"></div>


            <nav class="sidebar-menu">

                <a href="dashboard.html">
                    <span>⌂</span>
                    Início
                </a>

            </nav>


            <a href="login.html" class="logout">

                <span>↪</span>
                Sair

            </a>

        </aside>



        <!-- CONTEÚDO -->

        <main class="main-content">


            <section class="page-header">

                <span class="breadcrumb">
                    Início › Movimentação
                </span>

                <h1>
                    Movimentação
                </h1>

                <p>
                    Selecione uma opção no menu lateral
                    para realizar um lançamento ou cadastro.
                </p>

            </section>



            <!-- ÁREA ÚNICA -->

            <section
                class="movimentacao-container"
                id="areaMovimentacao">


                <div class="empty-state">

                    <div class="empty-icon">
                        +
                    </div>

                    <h3>
                        Selecione uma movimentação
                    </h3>

                    <p>
                        Escolha uma opção no menu lateral
                        para começar.
                    </p>

                </div>

            </section>

        </main>

    </div>

    <script src="../js/db.js"></script>
    <script src="../js/movimentacao.js"></script>

</body>

</html>
