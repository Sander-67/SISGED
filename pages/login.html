<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Página de login do sistema NetNúcleo">
    <meta name="author" content="Bárbara Rodrigues">
    <meta name="language" content="pt-br">
    <meta name="robots" content="index, follow">
    <meta name="color-scheme" content="dark light">

     <link rel="stylesheet" href="/css/login.css">
   
    <title>Login | NetNúcleo</title>
</head>
<body>
     <main class="login-container">

        <!-- LADO ESQUERDO -->
        <section class="login-image">

            <!-- Espaço reservado para imagem/identidade visual -->

        </section>


        <!-- LADO DIREITO -->
        <section class="login-content">

            <div class="login-card">

                <h1>Bem-vindo</h1>

                <p class="login-description">
                    Acesse sua conta para entrar no NetNúcleo
                </p>


                <!-- Unidade -->
                <div class="form-group">

                    <label for="unidade">
                        Unidade
                    </label>

                    <select id="unidade" name="unidade">

                        <option value="">
                            Selecione
                        </option>

                         <option value="BH-Horto">
                            BH-Horto
                        </option>

                         <option value="BH-Horto-Trilhas">
                           BH-Horto-Trilhas
                        </option>

                         <option value="BH-Horto-HUB">
                            BH-Horto-HUB
                        </option>

                    </select>

                </div>


                <!-- Usuário -->
                <div class="form-group">

                    <label for="usuario">
                        Usuário Institucional
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="absobrenome"
                    >

                </div>


                <!-- Senha -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <div class="password">

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                        >

                        <button
                            type="button"
                            onclick="mostrarSenha()"
                            class="eye"
                        >
                            ◉
                        </button>

                    </div>

                </div>


                <!-- Lembrar -->
                <div class="login-options">

                    <label>

                        <input
                            type="checkbox"
                            name="lembrar"
                        >

                        Lembrar-me

                    </label>


                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>


                <!-- Entrar -->
                <button
                    type="button"
                    class="btn-login"
                >
                    Entrar no Sistema
                </button>

            </div>

        </section>

    </main>

    <script src="../js/db.js"></script>    
    <script src="../js/script.js"></script>

</body>
</html>
